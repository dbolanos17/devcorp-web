<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Documento normativo con escudo de cumplimiento y lupa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#280b4a"/>
      <stop offset="1" stop-color="#05427f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51ade5"/>
      <stop offset="1" stop-color="#3871c1"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- red de transacciones -->
  <g stroke="#51ade5" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8" fill="none">
    <path d="M110 150 L260 250 L380 300"/>
    <path d="M90 450 L250 400 L380 360"/>
    <path d="M900 250 L1010 170 L1110 210"/>
    <path d="M900 400 L1030 470 L1120 420"/>
    <path d="M260 250 L250 400"/>
    <path d="M1010 170 L1030 470"/>
  </g>
  <g fill="#280b4a" stroke="#51ade5" stroke-opacity="0.8" stroke-width="3">
    <circle cx="110" cy="150" r="14"/>
    <circle cx="260" cy="250" r="18"/>
    <circle cx="90" cy="450" r="14"/>
    <circle cx="250" cy="400" r="18"/>
    <circle cx="1010" cy="170" r="18"/>
    <circle cx="1110" cy="210" r="14"/>
    <circle cx="1030" cy="470" r="18"/>
    <circle cx="1120" cy="420" r="14"/>
  </g>
  <g fill="#51ade5" fill-opacity="0.9">
    <circle cx="260" cy="250" r="6"/>
    <circle cx="250" cy="400" r="6"/>
    <circle cx="1010" cy="170" r="6"/>
    <circle cx="1030" cy="470" r="6"/>
  </g>

  <!-- documento -->
  <g filter="url(#shadow)">
    <rect x="380" y="115" width="310" height="400" rx="22" fill="#f6f8fc"/>
  </g>
  <rect x="380" y="115" width="310" height="76" rx="22" fill="#3871c1"/>
  <rect x="380" y="160" width="310" height="31" fill="#3871c1"/>
  <rect x="408" y="140" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="408" y="162" width="76" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.55"/>
  <g fill="#c9d3e3">
    <rect x="408" y="225" width="254" height="12" rx="6"/>
    <rect x="408" y="253" width="220" height="12" rx="6"/>
    <rect x="408" y="281" width="254" height="12" rx="6"/>
    <rect x="408" y="309" width="190" height="12" rx="6"/>
    <rect x="408" y="347" width="254" height="12" rx="6"/>
    <rect x="408" y="375" width="232" height="12" rx="6"/>
    <rect x="408" y="403" width="150" height="12" rx="6"/>
  </g>
  <rect x="408" y="450" width="96" height="30" rx="15" fill="#280b4a" fill-opacity="0.9"/>
  <rect x="424" y="460" width="64" height="10" rx="5" fill="#51ade5"/>

  <!-- escudo -->
  <g filter="url(#shadow)">
    <path d="M790 150 L920 198 V312 C920 396 866 462 790 500 C714 462 660 396 660 312 V198 Z"
          fill="url(#shield)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <path d="M790 178 L896 217 V312 C896 380 853 435 790 468 Z" fill="#ffffff" fill-opacity="0.12"/>
  <polyline points="728,322 776,370 856,276" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lupa -->
  <circle cx="470" cy="418" r="58" fill="#51ade5" fill-opacity="0.18" stroke="#51ade5" stroke-width="13"/>
  <path d="M446 396 A32 32 0 0 1 482 384" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>
  <line x1="512" y1="460" x2="566" y2="514" stroke="#51ade5" stroke-width="18" stroke-linecap="round"/>
</svg>
