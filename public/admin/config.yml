# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: dbolanos17/devcorp-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c353efeb-b591-47dc-b2cd-74ee4467dc9e/pkce
  auth_token_endpoint: /sites/c353efeb-b591-47dc-b2cd-74ee4467dc9e/token
  gateway_url: https://gateway.decapbridge.com

  # Se ve quién hizo cada cambio
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://devcorp-ec.com

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción corta", name: "description", widget: "text" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["Financiero", "Tributario", "Laboral", "Contable", "Trámites"]
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Ícono (emoji)", name: "icon", widget: "string", default: "📰" }
      - { label: "Destacado en portada del blog", name: "featured", widget: "boolean", default: false }
      - { label: "Contenido del artículo", name: "body", widget: "markdown" }

  - name: "testimonials"
    label: "Testimonios"
    folder: "src/content/testimonials"
    create: true
    delete: true
    slug: "{{fields.name}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Nombre del cliente", name: "name", widget: "string" }
      - { label: "Cargo y empresa", name: "role", widget: "string" }
      - { label: "Estrellas (1 a 5)", name: "stars", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
      - { label: "Orden de aparición", name: "order", widget: "number", default: 0, value_type: "int", hint: "1 = primero, 2 = segundo, etc." }
      - { label: "Texto del testimonio", name: "body", widget: "text" }

  - name: "clients"
    label: "Clientes (logos)"
    folder: "src/content/clients"
    create: true
    delete: true
    slug: "{{fields.name}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Nombre del cliente", name: "name", widget: "string", hint: "Se usa como texto alternativo del logo." }
      - { label: "Logo", name: "logo", widget: "image", hint: "Idealmente PNG o SVG con fondo transparente." }
      - { label: "Sitio web del cliente (opcional)", name: "url", widget: "string", required: false }
      - { label: "Orden de aparición", name: "order", widget: "number", default: 0, value_type: "int", hint: "1 = primero, 2 = segundo, etc." }
